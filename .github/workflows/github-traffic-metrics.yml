name: GitHub traffic metrics

# GitHub's traffic API (views/clones/popular paths/referrers) only retains a rolling 14-day
# window -- anything older is gone. Since this repo is currently public specifically to save on
# Actions costs (see docs/security/public-repository-policy.md), knowing whether that's actually
# earning any real developer traffic/attention is worth tracking past that 14-day horizon,
# without adding an external monitoring service. This job snapshots the API into this repo on a
# schedule, so history accumulates in git instead of expiring silently.
#
# Needs a real PAT, not secrets.GITHUB_TOKEN -- verified empirically, not assumed. The traffic API
# requires actual collaborator-level push access; the Actions bot identity behind GITHUB_TOKEN
# does not qualify no matter what `permissions:` grants it (tried it: `gh: Resource not accessible
# by integration (HTTP 403)`, from a real Actions run, see PR #1276). TRAFFIC_METRICS_TOKEN is a
# classic PAT with the `repo` scope, generated from an account that has push access to this
# repository, added as a repository secret. GITHUB_TOKEN is still used for the commit/push at the
# end -- that part genuinely doesn't need more than `contents: write`.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot-traffic:
    name: Snapshot GitHub traffic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Fails loud and actionable here rather than several steps later as a bare 403 -- this is
      # exactly the mistake the first version of this workflow made (see PR #1276's history).
      - name: Verify TRAFFIC_METRICS_TOKEN is configured
        env:
          TOKEN_SET: ${{ secrets.TRAFFIC_METRICS_TOKEN != '' }}
        run: |
          if [ "$TOKEN_SET" != "true" ]; then
            echo "::error::TRAFFIC_METRICS_TOKEN repo secret is not set. GitHub's traffic API needs a real collaborator-level Personal Access Token -- the default GITHUB_TOKEN returns 403 (verified, not assumed). Create a classic PAT with the 'repo' scope from an account with push access to this repository, then add it as a repository secret named TRAFFIC_METRICS_TOKEN (Settings > Secrets and variables > Actions > New repository secret)."
            exit 1
          fi

      # Views/clones are daily-granularity time series (kept in a CSV, one row per calendar day,
      # upserted so a same-day re-run corrects today's still-accumulating count rather than
      # duplicating a row). Popular paths/referrers are a point-in-time snapshot, not a time
      # series worth diffing daily, so they're just overwritten each run rather than accumulated
      # -- a growing pile of near-identical JSON snapshots would be repo bloat for no real value.
      - name: Fetch traffic data and update metrics files
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_METRICS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p docs/metrics/github-traffic
          cd docs/metrics/github-traffic

          gh api "repos/$REPO/traffic/views" > /tmp/views.json
          gh api "repos/$REPO/traffic/clones" > /tmp/clones.json
          gh api "repos/$REPO/traffic/popular/paths" > /tmp/paths.json
          gh api "repos/$REPO/traffic/popular/referrers" > /tmp/referrers.json

          python3 <<'PYEOF'
          import csv
          import json
          import os

          def load_daily(path, count_key="count", uniques_key="uniques"):
              with open(path) as f:
                  data = json.load(f)
              return {
                  entry["timestamp"][:10]: (entry[count_key], entry[uniques_key])
                  for entry in data.get("views", data.get("clones", []))
              }

          views = load_daily("/tmp/views.json")
          clones = load_daily("/tmp/clones.json")

          csv_path = "traffic-log.csv"
          existing = {}
          if os.path.exists(csv_path):
              with open(csv_path, newline="") as f:
                  for row in csv.DictReader(f):
                      existing[row["date"]] = row

          all_dates = set(existing) | set(views) | set(clones)
          for date in all_dates:
              row = existing.get(date, {"date": date})
              if date in views:
                  row["views_count"], row["views_uniques"] = views[date]
              if date in clones:
                  row["clones_count"], row["clones_uniques"] = clones[date]
              existing[date] = row

          fieldnames = ["date", "views_count", "views_uniques", "clones_count", "clones_uniques"]
          with open(csv_path, "w", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames, restval="")
              writer.writeheader()
              for date in sorted(existing):
                  writer.writerow({k: existing[date].get(k, "") for k in fieldnames})

          print(f"traffic-log.csv now has {len(existing)} day(s) on record")
          PYEOF

          python3 -c "
          import json
          paths = json.load(open('/tmp/paths.json'))
          referrers = json.load(open('/tmp/referrers.json'))
          json.dump(
              {'paths': paths, 'referrers': referrers},
              open('popular-latest.json', 'w'),
              indent=2,
          )
          "

      # [skip ci] deliberately: #1248 made every gated CI job run unconditionally on push to main
      # regardless of path filtering, so without this a scheduled metrics-only commit would
      # trigger the full backend/frontend/mobile/admin-portal/e2e suite every 6 hours for a
      # two-file docs change -- exactly the Actions-minute cost this repo has spent real effort
      # cutting elsewhere this session.
      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/metrics/github-traffic/
          if git diff --cached --quiet; then
            echo "No traffic-metrics change to commit."
          else
            git commit -m "chore(metrics): update GitHub traffic snapshot [skip ci]"
            git push
          fi
