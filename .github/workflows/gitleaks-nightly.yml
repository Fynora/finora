name: Secret scan (nightly, full history)

# ci.yml's secret-scan job only ever sees one PR's diff. A secret that entered the repository
# before that job existed -- or through a push straight to main, or through a merge whose diff
# gitleaks-action's range-detection missed -- would never surface there. This job re-scans the
# entire commit history on a schedule instead of a diff, so that gap doesn't depend on catching
# everything at the moment it was introduced.
#
# 03:30 UTC, offset from e2e-nightly.yml's 03:00 run for no reason beyond keeping the two
# schedules visibly distinct in the Actions history -- both run on GitHub-hosted runners with a
# fresh VM each, so there's no shared-machine contention to avoid the way there was in the
# self-hosted period (see e2e-nightly.yml's header for that history).
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

# A scheduled run that is still going when the next one fires should not be joined by it.
concurrency:
  group: gitleaks-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-history-scan:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    # A full-history scan of ~1200 commits takes low single-digit minutes locally; this is a hang
    # detector; it should never fire because the scan itself got slow.
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 -- without full history this job would silently degrade into re-scanning
      # only what a shallow checkout happens to carry, which defeats the reason it exists.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # SHA-pinned -- see ci.yml's secret-scan job for why (this is the same action, same reasoning).
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No PR to comment on for a scheduled run; see ci.yml's secret-scan job for why comments
          # are off there too.
          GITLEAKS_ENABLE_COMMENTS: false
          # Same gap ci.yml's secret-scan job had after the org move (PR #1170): gitleaks-action
          # gates org-owned repos behind a (free) license key, which the action reads from its own
          # environment -- setting the GITLEAKS_LICENSE repository secret alone does nothing
          # without this line naming it explicitly, the same way GITHUB_TOKEN above has to be. This
          # workflow never got that fix, since it's a separate file from ci.yml's own gitleaks step.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # Every scheduled workflow's visibility gate reads github.event.repository.private. GitHub
      # added `repository` to scheduled-run payloads on 2022-09-27 (changelog), but the
      # gitleaks-action source pinned above still says it is undefined there (written two weeks
      # earlier). This job runs on schedule in both profiles, so it is where that gets proven
      # rather than assumed: a missing field turns this run red. A missing field fails safe (every
      # gate reads null as public, so jobs run), but in the private profile that would quietly
      # spend the minute allowance. docs/architecture/infrastructure/ci-visibility-profiles.md.
      # always(): reported even when the scan above fails.
      - name: Visibility field present in this event
        if: always()
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$REPO_PRIVATE" != true ] && [ "$REPO_PRIVATE" != false ]; then
            echo "::error::github.event.repository.private is missing from this $EVENT event, so every visibility gate treats the repository as public."
            exit 1
          fi
          echo "github.event.repository.private=$REPO_PRIVATE ($EVENT event)"
