name: Migration order

# Both migration-order jobs lived in ci.yml until 2026-10-04. They moved here for one reason: a
# `paths:` filter is a workflow-level trigger setting, and these two jobs are the only CI jobs whose
# whole question is "did a migration change?". In ci.yml, migration-order ran on every pull_request
# event and exited in seconds when the PR had no migration -- free while the repository is public,
# but a full billed minute per PR event while it is private (GitHub bills each job rounded up to
# the minute, and the private allowance on the org's Free plan is 2,000 minutes a month; measured
# 2026-09-27..10-04: ~300 PR events a week, so this one check alone would have used ~1,300 of
# them). Path-filtered, it runs only for PRs and main pushes that actually touch migrations, in
# either visibility -- see docs/architecture/infrastructure/ci-visibility-profiles.md.
#
# Nothing is lost by filtering: a PR that adds no migration cannot collide with main's, and a
# main push that changes no migration does not move any open PR's floor. GitHub evaluates
# pull_request path filters against the PR's whole three-dot diff, so every later push to a PR
# that adds a migration still triggers it, not only the push that added the file. The filter's
# one documented blind spot is a diff over 3,000 files whose migration is not among the first
# 3,000 returned; no PR in this repository has been near that size.
#
# The script and its self-test are in the filter too, so a change to the checker itself is
# exercised on its own PR rather than first on whichever migration PR comes next.
#
# Neither job is a required check in main's ruleset, so a PR this never runs on is not left
# waiting on a missing status.
on:
  push:
    branches: [main]
    paths:
      - 'backend/src/main/resources/db/migration/**'
      - 'scripts/check-migration-order.py'
      - 'scripts/test-check-migration-order.py'
      - '.github/workflows/migration-order.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'backend/src/main/resources/db/migration/**'
      - 'scripts/check-migration-order.py'
      - 'scripts/test-check-migration-order.py'
      - '.github/workflows/migration-order.yml'

# Same policy as ci.yml: a superseded PR run is cancelled, a run on main is a record worth keeping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege, as in ci.yml; migration-order-recheck widens only what the re-run endpoint needs.
permissions:
  contents: read

jobs:
  # Flyway runs with outOfOrder=false, so production refuses to deploy a migration numbered at or
  # below one it has already applied. On 2026-09-27 #1798 (V236) merged and deployed before #1811
  # (V235); every deploy after that failed "Detected resolved migration not applied to database:
  # 235" -- fixed by #1818, which renames it V236_1. No other job can see this: they all migrate a FRESH
  # database, where any order applies cleanly.
  #
  # The floor is origin/main as fetched when this job runs -- not the PR's base SHA, which is
  # frozen at the event -- so a re-run always judges against the main that exists now. What makes
  # it re-run when main moves is migration-order-recheck below: the main ruleset's required checks
  # are not "strict" (branches need not be up to date to merge), so without that job a PR that was
  # green when opened would stay green after a higher version landed.
  #
  # Not draft-gated: a draft that adds a migration can still collide with main. Path-filtered at
  # the workflow level (see the top of this file). fetch-depth: 0 because the merge base is needed.
  migration-order:
    name: Migration version order
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Self-test first: a diff that silently finds nothing would pass every PR and look exactly
      # like a clean one. It asserts lower/equal versions fail, higher and sub-versions pass, and a
      # rename above the floor (#1818's shape) passes.
      - name: Migration order (self-test)
        run: python3 scripts/test-check-migration-order.py

      - name: Migration order against current main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python3 scripts/check-migration-order.py --base origin/main --head "${{ github.event.pull_request.head.sha }}"

  # When a push to main changes its migrations, the floor every open PR is judged against has
  # moved. Re-run each affected open PR's migration-order job so its check turns red on the PR
  # itself, before anyone merges it. A re-run keeps the original event payload (same head SHA) but
  # fetches origin/main fresh, which is exactly the comparison wanted.
  #
  # The compare API lists at most 300 files; a push that hits that cap is treated as having
  # changed migrations rather than trusted to be clean.
  #
  # Only PRs that touch the migration directory are re-run -- plus any PR whose file list the API
  # truncated (changedFiles > files returned), so a large PR is never silently skipped.
  #
  # actions: write is scoped to this job only: it is what the job re-run endpoint requires, and
  # this job only ever runs on a push to main, never on PR-controlled code.
  migration-order-recheck:
    name: Re-check open PRs' migration order
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Mostly idle: long enough to wait out open PRs' in-progress CI runs (median ~4 min).
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Re-run migration-order on open PRs that add migrations
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          DIR: backend/src/main/resources/db/migration/
        run: |
          set -euo pipefail
          changed=$(gh api "repos/$GH_REPO/compare/$BEFORE...$AFTER" \
            --jq "if (.files | length) >= 300 then 300 else [.files[].filename | select(startswith(\"$DIR\"))] | length end")
          if [ "$changed" = 0 ]; then
            echo "This push did not change main's migrations; every open PR's floor is unchanged."
            exit 0
          fi
          prs=$(gh pr list --state open --limit 300 --json number,headRefOid,changedFiles,files \
            --jq ".[] | select(.changedFiles > (.files | length) or any(.files[]; .path | startswith(\"$DIR\")))
                  | \"\(.number) \(.headRefOid)\"")
          if [ -z "$prs" ]; then
            echo "No open PR touches $DIR."
            exit 0
          fi
          status=0
          while read -r pr sha; do
            run=$(gh run list --workflow migration-order.yml --event pull_request --commit "$sha" --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')
            # No run is expected for a PR picked only because its file list was truncated and that
            # adds no migration (the path filter never triggered), or for one last pushed before
            # this workflow existed (its check ran in ci.yml) -- push to it to get one.
            if [ -z "$run" ]; then
              echo "::warning::#$pr ($sha): no Migration order run found to re-run."
              continue
            fi
            job=$(gh run view "$run" --json jobs \
              --jq '.jobs[] | select(.name == "Migration version order") | .databaseId')
            if [ -z "$job" ]; then
              echo "::warning::#$pr: run $run has no Migration version order job (predates it?)."
              continue
            fi
            # GitHub refuses to re-run a job while its run is still going (403 "The workflow run
            # containing this job is already running" -- measured on #1819), and this job may have
            # finished before main moved. So wait for the run, then re-run it.
            if [ "$(gh run view "$run" --json status --jq .status)" != completed ]; then
              echo "#$pr: run $run still in progress; waiting for it before re-running."
              gh run watch "$run" --interval 20 > /dev/null || true
            fi
            if gh api -X POST "repos/$GH_REPO/actions/jobs/$job/rerun" --silent; then
              echo "#$pr: re-running Migration version order (run $run, job $job)."
            else
              echo "::warning::#$pr: could not re-run job $job of run $run -- push to the PR or re-run it by hand."
              status=1
            fi
          done <<< "$prs"
          exit $status
