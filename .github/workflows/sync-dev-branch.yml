name: Sync dev branch

# Dev environment matrix (admin-portal/frontend/mobile Dev tier, alongside the backend's existing
# Railway Dev environment). `dev` is a persistent branch that Cloudflare Pages binds
# dev-app.finoratech.info/dev-admin.finoratech.info to (as a branch-alias custom domain, not a
# second Pages project) -- it exists purely to always reflect main's latest commit, not to carry
# any history of its own.
#
# Goes through a PR rather than a direct push: `git push origin HEAD:refs/heads/dev` doesn't
# preserve the "only sync what CI actually passed" guarantee this workflow wants, and `dev` may
# gain real branch protection later, which would reject a direct push outright.
#
# This waits for the PR's own checks to settle and merges directly, rather than using
# `gh pr merge --auto`: that API call (enablePullRequestAutoMerge) requires the target branch to
# already have a protection rule configured, and confirmed via `gh api repos/{owner}/{repo}/
# rulesets` -- `dev` has none (only `main` does, scoped to `~DEFAULT_BRANCH`) -- so `--auto` fails
# outright with "Protected branch rules not configured for this branch" before it ever gets to
# check any status. This polls and merges directly instead, which works regardless of whether
# `dev` ever gets its own ruleset.
#
# A merge commit, not a rebase or squash: keeps `dev`'s history a literal superset of `main`'s
# rather than a rewritten copy, so `git merge-base --is-ancestor main dev` stays true and this
# workflow's own "is there anything to sync" check keeps working correctly next time.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Two pushes to main close together must not race each other into creating two sync PRs (the
# second run's "does a PR already exist" check can pass before the first run's gh pr create has
# actually landed). cancel-in-progress: false, not true -- the queued second run should still
# execute once the first finishes, so it can correctly find "nothing left to sync" via the
# merge-base check below, same reasoning ci.yml/e2e-nightly.yml already apply to their own jobs.
concurrency:
  group: sync-dev-branch
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Open (or reuse) the main -> dev sync PR, wait for CI, and merge it
        run: |
          git fetch origin main dev

          if git merge-base --is-ancestor origin/main origin/dev; then
            echo "dev is already up to date with main -- nothing to sync."
            exit 0
          fi

          existing=$(gh pr list --base dev --head main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            pr="$existing"
            echo "Reusing existing sync PR #$pr"
          else
            # gh pr create has no --json/--jq output mode -- it prints the new PR's URL to stdout
            # on success, so the number is just the URL's last path segment.
            url=$(gh pr create --base dev --head main \
              --title "Sync dev with main" \
              --body "Automated -- keeps the Dev environment's branch reflecting main's latest commit. Merges once main's CI run for this commit passes.")
            pr="${url##*/}"
            echo "Opened sync PR #$pr"
          fi

          # No --auto here -- see this step's own comment above for why.
          #
          # Security/privacy audit finding F-06 (2026-09-18): this used to poll `gh pr checks`
          # and grep its text for "fail", swallowing gh's own errors with `|| true` -- a fail-OPEN
          # gate (a CLI/API error, a cancelled check, or running out of polls all fell through to
          # merge). #1628 replaced that with `gh pr checks --watch --fail-fast`, which is fail-closed
          # but gated on EVERY check attached to the PR's head commit. That head is main's latest
          # commit, so the list includes this very job's own `sync` check (still pending while it
          # waits -- it can never see "all finished") plus checks that say nothing about whether
          # main's CI passed: the Maestro emulator E2E, and a Railway deploy status. So a normal run
          # could only fail fast on one of those or time out at 20 minutes; every sync that merged
          # after 2026-09-18 was a manual re-run after main had already moved past the run's commit.
          #
          # The gate is now the one thing it exists to prove: the CI workflow's push run for this
          # exact commit finished with conclusion `success`. Fail-closed exactly as F-06 requires:
          # any gh/jq error, a failed or cancelled run, or the deadline passing is `not merging`,
          # and nothing merges without an explicit success. On main, ci.yml's concurrency never
          # cancels a push run (cancel-in-progress is false for refs/heads/main), so that run always
          # reaches a real conclusion.
          head=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
          if [ -z "$head" ]; then
            echo "Could not read #$pr's head commit -- not merging."
            exit 1
          fi
          if [ "$head" != "$GITHUB_SHA" ]; then
            # main moved on after this run was triggered; the run for that newer commit (queued
            # behind this one by the concurrency group) verifies and merges it instead.
            echo "#$pr now points at $head, not this run's $GITHUB_SHA -- leaving it to that commit's own sync run."
            exit 0
          fi

          echo "Waiting for CI (push run) on $head to finish..."
          deadline=$((SECONDS + 40 * 60))
          while :; do
            if ! runs=$(gh run list --workflow ci.yml --commit "$head" --event push \
                  --json status,conclusion --limit 20); then
              echo "gh run list failed -- not merging."
              exit 1
            fi
            total=$(jq 'length' <<<"$runs")
            if [ "$total" -gt 0 ] && [ "$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")" -eq 0 ]; then
              if [ "$(jq '[.[] | select(.conclusion != "success")] | length' <<<"$runs")" -eq 0 ]; then
                echo "CI passed on $head."
                break
              fi
              echo "CI on $head did not succeed ($(jq -c '[.[].conclusion]' <<<"$runs")) -- not merging."
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "CI on $head had not finished after 40 minutes -- not merging."
              exit 1
            fi
            sleep 20
          done

          # A merge commit, not squash or rebase -- see this file's own top comment for why dev's
          # history needs to stay a literal superset of main's.
          # --match-head-commit: merge exactly the commit whose CI was just verified, never a newer
          # head that landed on main while this waited.
          gh pr merge "$pr" --merge --match-head-commit "$head"
