spring:
  jpa:
    show-sql: false
  # baseline-on-migrate exists to adopt Flyway on a database that predates it, which this project
  # did once, at V1. In prod it is now only a hazard: pointed at a non-empty database with no
  # flyway_schema_history (a restore, a hand-created database), it would record a baseline and
  # skip every migration up to it, and ddl-auto=validate only catches the columns entities map.
  # Off here so that situation fails loudly instead.
  flyway:
    baseline-on-migrate: false

logging:
  level:
    root: WARN
    com.finora: INFO
    org.springframework.security: WARN

# API docs are disabled by default in production — a public /swagger-ui.html or /v3/api-docs
# is reconnaissance material for an attacker on a financial API. Re-enable deliberately
# (e.g. behind a separate auth-gated route, or only for an internal network) if you need it,
# rather than leaving the framework default of "on" unexamined.
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
