spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finora_test}
  jpa:
    show-sql: false
  # Test profile only; production stays at application.yml's deliberate 200ms. Lettuce uses this
  # same value as its connection-initialization (handshake) deadline, and the timer starts as soon
  # as the channel registers. In a fresh Spring context the first Redis call is
  # AbstractIntegrationTest.resetRedisBackedLimiterState(). On a machine running several
  # Testcontainers suites at once, that first handshake overran 200ms and errored a test with
  # "Connection initialization timed out after 200 millisecond(s)" (AuthFlowIT and
  # PasswordChangeFlowIT, 2026-10-02). Measured under synthetic CPU load inside the Docker VM and
  # on the host: the first connection in a fresh JVM failed this way in 4 of 6 runs at 200ms (one
  # more failed a PING at 200ms instead) and in 0 of 6 runs at 1000ms. Every handshake failure was
  # on the JVM's first connection. connect-timeout stays at 200ms: no failure involved it.
  # Cost: tests that cut the connection through Toxiproxy wait this long for each Redis call they
  # make during the cut, so do not raise it further without measuring that.
  data:
    redis:
      timeout: 1000ms

logging:
  level:
    root: WARN
    com.finora: INFO

# The merchant-learning queue's scheduler and async nudge are off by default under test, so the
# suite is deterministic: an event enqueued by one test must not be drained by a background thread
# while another test is asserting on it. Tests that exercise the queue drive it explicitly through
# MerchantLearningEventWorker.drainOnce(), which deliberately does not consult this flag.
# MerchantLearningNudgeIT turns it back on for the one case that has to prove the async path works.
app:
  learning:
    queue:
      enabled: false

  # Off under test so the suite is deterministic. Tests drive NotificationDispatcher directly via
  # drainOnce()/recoverAbandoned(), which deliberately do not consult this flag.
  notification:
    queue:
      enabled: false

  # Admin push campaigns. The scheduler is off under test for the same reason as every poller here:
  # a background tick claiming a campaign another test just made ACTIVE is cross-test pollution.
  # Tests drive PushCampaignScheduler.runDue(now) directly, which does not consult this flag.
  # drain-max-seconds 0 stops a run from draining the shared notification queue (drainOnce ignores
  # the queue-enabled flag above). max-audience is lifted because the audience is global and other
  # tests leave eligible users behind; the rollout-limit test sets it explicitly.
  push-campaigns:
    scheduler:
      enabled: false
    drain-max-seconds: 0
    max-audience: 1000000

  # BH-047 moved the expired-import-session sweep from the upload path to a scheduled job. Off
  # under test for the same reason the learning queue's poller is: a background thread deleting
  # import_sessions rows mid-run is precisely the cross-test pollution BH-058 was about. Tests that
  # exercise the sweep call ImportSessionService.sweepExpiredSessions() directly, which deliberately
  # does not consult this flag.
  import:
    session-cleanup:
      enabled: false

  # BH-017. Same reasoning as session-cleanup above: a background thread reclaiming R2/filesystem
  # objects mid-test is exactly the cross-test pollution BH-058 was about. Tests that exercise the
  # sweep call StatementStorageSweepService.sweep() directly, which does not consult this flag.
  statement-storage:
    sweep:
      enabled: false

  # Same reasoning again: a background thread re-reading statements and writing previews mid-test
  # is the cross-test pollution BH-058 was about. Tests call StatementRefreshDryRunService.runBatch()
  # or check() directly, which do not consult this flag.
  statement-refresh:
    dry-run:
      enabled: false

  # Same reasoning again: the overdue-hold escalation (HoldOverdueEscalationService) is on by
  # default, and a background run would mark and re-save other tests' backdated holds mid-test -- a
  # version conflict for whichever test saves that job next. Tests call escalate() directly, which
  # does not consult this flag.
  hold-overdue:
    escalation:
      enabled: false

  # Bug 14. Same reasoning as import.session-cleanup above: a background thread deleting
  # refresh_tokens rows mid-run is exactly the cross-test pollution BH-058 was about. Tests that
  # exercise the sweep call RefreshTokenService.sweepExpiredTokens() directly, which deliberately
  # does not consult this flag.
  security:
    refresh-token-cleanup:
      enabled: false

  # Same reasoning as statement-storage.sweep above: a background thread purging accounts mid-run
  # is exactly the cross-test pollution BH-058 was about. Tests that exercise the sweep call
  # AccountPurgeSweepService.sweep() directly, which does not consult this flag.
  account-purge:
    sweep:
      enabled: false

  # Same reasoning again, and it bites harder here than for most sweeps: this one rewrites columns
  # on transactions, the table nearly every integration test asserts against. A pass firing mid-test
  # would change counterparty_type under a running assertion. Tests that exercise it call
  # CounterpartyBackfillSweepService.sweep() directly, which does not consult this flag.
  counterparty-backfill:
    sweep:
      enabled: false

  # Same again: CategorySuggestionSweepService rewrites categories on transactions. Tests call
  # sweep() directly, which does not consult this flag.
  category-suggestion-sweep:
    enabled: false

  # Same again: InterestLabelRecheckSweepService rewrites merchant labels on transactions. Tests
  # call sweep() directly, which does not consult this flag.
  interest-label-recheck:
    sweep:
      enabled: false

  # Same reasoning again: a background thread writing net_worth_snapshots mid-test is the
  # cross-test pollution BH-058 was about. Tests that exercise the sweep call
  # NetWorthSnapshotSweepService.sweep() directly, which does not consult this flag.
  net-worth-snapshot:
    sweep:
      enabled: false

  # Same reasoning again: a background thread writing health_score_snapshot mid-test is the
  # cross-test pollution BH-058 was about. Tests that exercise the sweep call
  # HealthScoreSnapshotSweepService.sweep() directly, which does not consult this flag.
  health-score-snapshot:
    sweep:
      enabled: false

  # Subscription billing V1 -- same reasoning as the sweeps above: a background thread downgrading
  # subscriptions mid-test is the cross-test pollution BH-058 was about. Tests call
  # SubscriptionReconciliationSweepService.sweep() directly, which does not consult this flag.
  subscription-reconciliation:
    sweep:
      enabled: false

  # Same reasoning as subscription-reconciliation.sweep above -- tests call
  # SubscriptionCancellationDispatchSweepService.sweep() directly.
  subscription-cancellation-dispatch:
    sweep:
      enabled: false

  # Same BH-058 reasoning as every sweep above: a background thread reprocessing webhook_events rows
  # mid-test is exactly the cross-test pollution this flag exists to prevent. Tests call
  # WebhookEventRecoverySweepService.sweep() directly, which does not consult this flag.
  webhook-event-recovery:
    sweep:
      enabled: false

  # Referral milestone rewards (design spec at docs/superpowers/specs/
  # 2026-09-14-referral-milestone-rewards-design.md). Same BH-058 reasoning as every sweep above: a
  # background thread activating/expiring referral grants mid-test is exactly the cross-test
  # pollution this flag exists to prevent. Tests call ReferralGrantSweepService.sweep() directly,
  # which does not consult this flag.
  referral-grant:
    sweep:
      enabled: false

  # BH-044. Same reasoning as statement-storage.sweep above: a background thread rewriting
  # audit_logs rows (clearing metadata, stamping redacted_at) mid-test is exactly the cross-test
  # pollution BH-058 was about -- a test asserting on a row's real metadata could otherwise lose
  # a race against the scheduler wiping it out from under the assertion. Tests that exercise the
  # sweep call AuditService.redactExpiredMetadata() directly, which does not consult this flag.
  audit:
    redaction:
      enabled: false

  # Gmail OAuth (Phase B). The client stays unconfigured under test -- the endpoints' behaviour
  # WITHOUT a Google client is itself part of what GmailOAuthEndpointIT pins, and no test should
  # depend on real Google credentials.
  #
  # post-connect-redirect is pointed at localhost deliberately: the callback answers with a 302, and
  # anything that follows redirects (TestRestTemplate does, by default) would otherwise make a live
  # request to the production frontend from the test suite.
  integrations:
    google:
      post-connect-redirect: http://localhost/settings
      # Same reasoning as import.session-cleanup above: a background thread deleting
      # gmail_oauth_states mid-run is the cross-test pollution BH-058 was about. Tests call
      # GmailConnectionService.sweepExpiredStates() directly, which ignores this flag.
      state-cleanup:
        enabled: false
      # Off for a stronger reason than the sweep above: this worker makes OUTBOUND HTTP CALLS. Left
      # on, a scheduled tick during an integration test would try to reach Google with whatever
      # connection rows that test just inserted. Tests call GmailDiscoveryWorker.runOnce() directly,
      # which ignores this flag.
      discovery:
        enabled: false

    # Subscription billing V1 -- RazorpayProperties.isConfigured() requires all three of these
    # non-blank, so every one must be set here or every webhook/checkout request 503s before ever
    # reaching its own logic under test.
    razorpay:
      key-id: test-key-id
      key-secret: test-key-secret
      webhook-secret: test-webhook-secret

    # Subscription billing V4 -- same reasoning as razorpay above: RevenueCatProperties.isConfigured()
    # requires this non-blank, or the webhook 503s before ever reaching its own logic under test.
    revenuecat:
      webhook-signing-secret: test-revenuecat-webhook-secret

    # Same reasoning as subscription-reconciliation.sweep below (BH-058): a background thread
    # publishing gauge/log state mid-test is exactly that cross-test pollution risk, even though
    # this sweep itself is read-only. Tests that exercise it call
    # AccountAggregatorOutageSweepService.sweep() directly, which does not consult this flag.
    #
    # Account Aggregator (Plan 5) -- same reasoning as google.discovery above: a scheduled tick
    # during an integration test would re-validate whatever AA link rows that test just inserted,
    # against real EntitlementService state that may not be set up for it yet. Tests call
    # AccountAggregatorLinkLifecycleSweepService.sweep() directly, which ignores this flag.
    setu:
      outage-sweep:
        enabled: false
      lifecycle-sweep:
        enabled: false
      # Plan 6 Track A. Same reasoning as the sweeps above: a scheduled tick during an integration
      # test would force-fetch (a real, billable Setu call once a real gateway exists) whatever AA
      # link rows that test just inserted. Tests call
      # AccountAggregatorReconciliationSweepService.sweep() directly, which ignores this flag.
      reconciliation-sweep:
        enabled: false
