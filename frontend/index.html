<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fynora — Personal finance, simplified</title>
  <!-- The description is the homepage hero's own sentence (landing-config.ts, hero.blurb), which is
       reviewed copy; seoFiles.test.tsx fails if the two drift. It replaced "grow your money", which
       the product does not do. Every prerendered page overrides description/og:title/og:description
       and adds og:url (scripts/prerender.mjs). There is deliberately NO og:url and NO canonical
       here: this file is also the SPA fallback for every unlisted route, so either would name the
       homepage as the address of /trust, /your-data and /cookie-policy.
       og:image is public/og-image.png, a 1200x630 card (the hero headline and a sample statement,
       both taken from the landing page's own copy and demo), so the card type is the large-image
       one. The absolute URL is deliberate: link-preview crawlers do not resolve relative paths.
       Every page shares this one image. It replaced the 256x256 logo. -->
  <meta name="description" content="Fynora reads PDF and CSV statements from Indian banks and credit cards, checks its own work, and sorts every transaction." />
  <meta property="og:site_name" content="Fynora" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Fynora — Personal finance, simplified" />
  <meta property="og:description" content="Fynora reads PDF and CSV statements from Indian banks and credit cards, checks its own work, and sorts every transaction." />
  <meta property="og:image" content="https://app.fynora.net/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Fynora. Upload a bank statement. See where every rupee went. A sample statement with each transaction sorted into a category." />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" sizes="256x256" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- "Sign in with Google" (GoogleSignInButton.tsx) can't draw anything until Google's own GIS
       script has loaded from this origin AND run -- unlike the Apple button beside it, which
       renders its own real markup immediately and only defers Apple's SDK load to click time.
       That gap is inherent to using Google's real widget (Google draws the button itself, for
       identity/anti-fraud reasons), but the DNS+TLS setup to a domain this page hasn't talked to
       yet is not inherent -- the script tag isn't added until the button component mounts, so
       without this hint that connection setup only starts then too. Preconnecting here lets the
       browser have the connection ready before the component even mounts, which is real,
       measurable time off exactly the "Google button takes longer to appear than Apple's" gap.
       Harmless on every other page: an idle preconnected connection just goes unused. -->
  <link rel="preconnect" href="https://accounts.google.com">
  <!-- Inter carries the product UI; Manrope is headings-only, used on the marketing page and
       (via Tailwind's `font-display`) the auth flow's headings/wordmark. Caveat is the
       hand-drawn annotation on Statement History's hero only (via Tailwind's `font-handwriting`)
       -- one weight (600), since that's the only one anything sets. One request for all three,
       and Manrope is limited to the three weights either surface actually sets (600/700/800)
       rather than the whole family. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
</head>
<body class="bg-bg">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
