# Signs in (same account as login.yaml) and checks the Home tab actually renders real dashboard
# content rather than a stuck loading spinner or the error state -- see DashboardScreen.tsx's own
# loading/error branches. Assumes nothing about ledger contents: a freshly seeded account has no
# transactions, so this only asserts on what's true for EVERY account, verified vs.
# mobile/src/screens/DashboardScreen.tsx directly rather than assumed.
appId: com.fynora.android
env:
  TEST_EMAIL: maestro-test@finora.test
  TEST_PASSWORD: MaestroSeedPass2026
---
- launchApp:
    clearState: true
- tapOn: "Email or mobile number"
- inputText: ${TEST_EMAIL}
# See login.yaml's own comment: the keyboard covers "Continue" too, and a tap through it can hit
# Gboard's own toolbar instead of the app.
- hideKeyboard
- tapOn: "Continue"
- tapOn: "Password"
- inputText: ${TEST_PASSWORD}
# See login.yaml's own comments: the keyboard covers the submit button until dismissed, and
# AuthScreenLayout's title is also literally "Sign in" so the button needs its own testID.
- hideKeyboard
- tapOn:
    id: "login-submit"

- assertVisible: "Home"
# Section order below is the passbook redesign's (#1318, 2026-09-10), verified directly against
# DashboardScreen.tsx rather than assumed -- it superseded the #1301 premium-redesign order this
# flow was originally written against, and shipping #1318 without updating this flow broke it
# (Recent Transactions became unreachable -- see the comment at that step below). For THIS flow's
# account (freshly seeded, zero transactions), most of the screen's real order matters less than it
# looks: Financial Health Hero/Health Factors, Financial Note, Upcoming, Categorization Confidence,
# Next Actions, and Detected Issues are all gated on real transaction data existing
# (DashboardScreen.tsx's own isEmpty/healthScoreAvailable/data-length checks) and don't render at
# all here -- confirmed by reading those gates directly. The effective order for this account is:
# LedgerSnapshotCard (Income/Expenses/Net Savings/Savings Rate) -> Cash Flow Trend + Accounts row
# (Total Balance) -> Spending by Category -> Goals (heading only) -> Recent Transactions ->
# Quick Actions -> Cash Flow (full) -> Budget Progress -> Getting Started.
- assertVisible: "Income"
- assertVisible: "Expenses"
- assertVisible: "Net Savings"
# Total Balance lives in AccountsCard, reached after LedgerSnapshotCard -- real added height
# between the KPI row and here that Income/Expenses/Net Savings/Savings Rate just above don't need
# to scroll past.
- scrollUntilVisible:
    element:
      text: "Total Balance"
    direction: DOWN
- assertVisible: "Total Balance"
- scrollUntilVisible:
    element:
      text: "Spending by Category"
    direction: DOWN
- assertVisible: "Spending by Category"
# Recent Transactions (grouped with Quick Actions and Upcoming, moved here as a block by #1318)
# sits BEFORE the full Cash Flow card now, the reverse of the pre-#1318 order this flow used to
# assume (Cash Flow, then Recent Transactions, in the same scroll pass). Scrolling to the wrong one
# first would carry the viewport past the other, since Maestro only scrolls forward here -- this is
# exactly what broke the day #1318 shipped.
- scrollUntilVisible:
    element:
      text: "Recent Transactions"
    direction: DOWN
- assertVisible: "Recent Transactions"
# Anchored regex, not a plain substring: CashFlowMiniCard's own heading is literally
# "Cash Flow Trend" and sits in the same row as Total Balance, several scroll-stops above this
# card -- an unanchored "Cash Flow" pattern risks matching that instead of the full card this step
# actually means to find.
- scrollUntilVisible:
    element:
      text: "^Cash Flow$"
    direction: DOWN
- assertVisible: "^Cash Flow$"
