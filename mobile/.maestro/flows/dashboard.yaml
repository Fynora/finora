# Signs in (same account as login.yaml) and checks the Home tab actually renders real dashboard
# content rather than a stuck loading spinner or the error state -- see DashboardScreen.tsx's own
# loading/error branches. Assumes nothing about ledger contents: a freshly seeded account has no
# transactions, so this only asserts on what's true for EVERY account, verified vs.
# mobile/src/screens/DashboardScreen.tsx directly rather than assumed.
appId: com.fynora.android
env:
  TEST_EMAIL: maestro-test@finora.test
  TEST_PASSWORD: MaestroSeedPass2026
---
- launchApp:
    clearState: true
- tapOn: "Email or mobile number"
- inputText: ${TEST_EMAIL}
# See login.yaml's own comment: the keyboard covers "Continue" too, and a tap through it can hit
# Gboard's own toolbar instead of the app.
- hideKeyboard
- tapOn: "Continue"
- tapOn: "Password"
- inputText: ${TEST_PASSWORD}
# See login.yaml's own comments: the keyboard covers the submit button until dismissed, and
# AuthScreenLayout's title is also literally "Sign in" so the button needs its own testID.
- hideKeyboard
- tapOn:
    id: "login-submit"

- assertVisible: "Home"
# Mobile Dashboard premium redesign (#1301) reordered the whole screen. For THIS flow's account
# (freshly seeded, zero transactions), that reorder matters less than it looks: Financial Health
# Hero/Health Factors/AI Insight/Categorization Confidence/Next Actions/Detected Issues/Upcoming
# are all gated on real transaction data existing (DashboardScreen.tsx's own isEmpty/
# healthScoreAvailable checks) and don't render at all here -- confirmed by reading those gates
# directly, not assumed. So the KPI grid (now MonthlySnapshotGrid, Total Balance moved out of it)
# is still close enough to the top to need no scroll of its own.
- assertVisible: "Income"
- assertVisible: "Expenses"
- assertVisible: "Net Savings"
# Total Balance moved out of the KPI grid into AccountsCard, now reached after the new Quick
# Actions card -- real added height between the KPI grid and here that didn't exist before, so
# this needs its own scroll even though Income/Expenses/Net Savings just above didn't. Confirmed
# via the failed run's own UI-hierarchy dump (GitHub Actions run 34371311844, not customer data -- synthetic-ok): Income/Expenses/Net Savings/
# Savings Rate were already present in the tree at this scroll position, only AccountsCard's
# content (Total Balance included) was missing.
- scrollUntilVisible:
    element:
      text: "Total Balance"
    direction: DOWN
- assertVisible: "Total Balance"
# Spending by Category now renders directly after the Cash Flow Trend/Accounts row -- BEFORE the
# full Cash Flow card below, the reverse of the order this flow used to assume (Cash Flow, then
# Spending by Category, in the same scroll pass -- see DashboardScreen.tsx's real section order,
# verified by reading it directly: Quick Actions -> Cash Flow Trend + Accounts -> Spending by
# Category -> Upcoming -> Goals -> AI Insight -> Categorization Confidence -> Next Actions ->
# Detected Issues -> Cash Flow (full) -> Recent Transactions). Scrolling to the wrong one first
# would carry the viewport past the other, since Maestro only scrolls forward here.
- scrollUntilVisible:
    element:
      text: "Spending by Category"
    direction: DOWN
- assertVisible: "Spending by Category"
# ChecklistWidget (first-login onboarding flow, #1104) no longer sits between the KPI row and Cash
# Flow -- the premium redesign moved it to a collapsed accordion at the very bottom of the screen
# (Task 12, PR #1301). What pushes Cash Flow below the fold now is real content of its own: Goals,
# AI Insight (hidden for this account, but Categorization Confidence/Next Actions/Detected Issues
# are also all isEmpty-gated and hidden), so in practice just Goals' own section heading sits
# between Spending by Category and here for a zero-transaction account -- still enough on this
# emulator's 320x640 screen to need a scroll rather than a taller assertion timeout.
#
# Anchored regex, not a plain substring: CashFlowMiniCard's own heading is literally
# "Cash Flow Trend" and sits in the same row as Total Balance, several scroll-stops above this
# card -- an unanchored "Cash Flow" pattern risks matching that instead of the full card this step
# actually means to find.
- scrollUntilVisible:
    element:
      text: "^Cash Flow$"
    direction: DOWN
- assertVisible: "^Cash Flow$"
# DashboardScreen.tsx renders "Recent Transactions" unconditionally (see that file's own
# EmptyState branch for a zero-transaction account), but this emulator's screen is only 320x640 --
# too short to fit every card above the fold. A real run confirmed the section genuinely isn't in
# the mounted tree yet at this scroll position, not just visually clipped, so this needs an actual
# scroll rather than a taller assertion timeout.
- scrollUntilVisible:
    element:
      text: "Recent Transactions"
    direction: DOWN
- assertVisible: "Recent Transactions"
