# Signs in, imports .maestro/fixtures/maestro-statement.csv (3 rows, pushed to the emulator's
# Download folder by CI/local setup before this flow runs -- see mobile/.maestro/README.md), and
# confirms the summary screen. "Choose a file" opens the OS's own document picker
# (expo-document-picker -- see mobile/src/lib/statementFile.ts), not anything this app renders, so
# this flow drives Android's system Files UI directly rather than an in-app selector.
#
# Deliberately NOT idempotent by re-running against a fresh account each time: this flow reuses the
# same seeded account as login.yaml/dashboard.yaml (Maestro flows are static YAML with no per-run
# random data -- see seed-test-user.sh's own comment), so a second run stages the same 3 rows again
# and the review step's duplicate-detection notices they already exist. IMPORT_STAGE rate limiting
# aside, that's a second real code path being exercised, not a bug in the flow -- but it does mean
# CI seeds a fresh database per run rather than re-running this against a long-lived one.
appId: com.fynora.android
env:
  TEST_EMAIL: ${TEST_EMAIL || "maestro-test@finora.test"}
  TEST_PASSWORD: MaestroSeedPass2026
---
- launchApp:
    clearState: true
# Same reasoning as login.yaml's own launchApp -- without asserting the screen has actually
# settled first, the very first tapOn can fire before AuthEntryScreen has mounted, especially on a
# slow/cold emulator boot. This flow didn't have the wait login.yaml already does; added after a
# CI run failed here with "Element not found: Email or mobile number" immediately after launchApp.
- assertVisible: "Sign in or create an account"
- tapOn: "Email or mobile number"
- inputText: ${TEST_EMAIL}
# See login.yaml's own comment: the keyboard covers "Continue" too, and a tap through it can hit
# Gboard's own toolbar instead of the app.
- hideKeyboard
- tapOn: "Continue"
- tapOn: "Password"
- inputText: ${TEST_PASSWORD}
# See login.yaml's own comments: the keyboard covers the submit button until dismissed, and
# AuthScreenLayout's title is also literally "Sign in" so the button needs its own testID.
- hideKeyboard
- tapOn:
    id: "login-submit"

# Every signed-in phone sets a PIN before anything else (PinSetup.tsx, #2514); see the subflow.
- runFlow: ../subflows/set-pin.yaml

# Passbook redesign (#1318, 2026-09-10) reordered the whole Dashboard screen -- the "Import a
# statement" empty-state action (Recent Transactions' own EmptyState, for this still-zero-
# transaction account) used to sit above the fold and needed no scroll of its own, but now sits
# well below it, the same class of bug dashboard.yaml's own scrollUntilVisible steps exist to
# guard against (see that flow's own comments). tapOn never scrolls on its own.
#
# Root cause confirmed by instrumenting a real failing run (not the selector text -- that theory
# was tried and DISPROVEN): downloaded the CI job's own maestro-debug-artifacts and grepped
# device-logcat.txt across the whole 20s retry window for this element's own contentDescription.
# It's in the accessibility tree on every single one of ~50 retries, correctly labeled "Import a
# statement" -- so the selector was never the problem, substring matching works fine (see
# dashboard.yaml's own comment on that), and the seeded account genuinely has zero transactions.
# What the same log shows instead: the element's tracked boundsInScreen jump from
# `Rect(33, 658 - 287, 591)` (33px below the visible area) straight to `Rect(33, 0 - 287, -178)`
# (fully above it) between two consecutive retries, with no checkpoint in between where any part
# of it was ever inside the visible band -- one scroll swipe carries this specific, short
# (~76px-tall) target clean over the 591px-tall viewport in a single jump. dashboard.yaml's own
# targets (section headings) never hit this because they're wide/tall enough, or positioned such
# that a full-speed swipe doesn't skip them -- this one, a single compact EmptyState button near
# the bottom of a very short QVGA emulator screen, does. A slower scroll (smaller swipe per
# retry) gives the visibility check more checkpoints to land on while the button transits the
# viewport, closing the gap a fix to the selector text alone couldn't.
- scrollUntilVisible:
    element:
      text: "Import a statement"
    direction: DOWN
    speed: 15
- tapOn: "Import a statement"
- assertVisible: "Import a statement"
- tapOn: "Choose a file"

# Android's system document picker (DocumentsUI) opens on "Recent", which only shows files
# MediaStore has already indexed -- a file just placed there by `adb push` doesn't appear until
# indexed, verified against a real emulator run rather than assumed. The hamburger icon (top-left,
# no accessible label of its own -- verified via `maestro hierarchy`, hence a coordinate tap
# instead of a text/id selector) opens the root drawer, where "Downloads" always appears for the
# on-device Download folder regardless of MediaStore indexing.
- tapOn:
    point: "7%,8%"
- tapOn: "Downloads"
- tapOn: "maestro-statement.csv"

# [1-9]\d*, not \d+: the same button reads "Import 0 transactions" and stays disabled (a no-op
# tap) whenever every row is an unresolved possible-duplicate -- e.g. a rerun against a database
# that already has this exact statement's transactions in it (see this file's header comment).
# \d+ matches that "0" too, so a rerun would silently pass this assertion while tapping nothing
# and everything after it would fail on the review screen, not the summary -- confirmed by
# reproducing exactly that against a stale local database before tightening this.
- assertVisible: "File into"
# A new account needs its bank chosen before the statement can be imported (#2410, 2026-10-30):
# maestro-statement.csv names no bank, so ImportScreen shows the Bank field open with no choice and
# keeps "Import N transactions" blocked until one is picked. The nightlies of 2026-10-30 and
# 2026-10-31 both failed here on both attempts, and the saved UI hierarchy of the 2026-10-31 failure
# shows the review list with `import-bank-gate-notice` ("Choose the new account's bank above, or
# Other bank, before this can be imported.") while the backend log shows the CSV stage request and
# no confirm. "Other bank" is the choice that is always offered (BankField adds it itself, last,
# even if GET /banks fails), so the flow does not depend on which banks the registry holds.
#
# scrollUntilVisible rather than a bare tapOn: tapOn never scrolls, and this screen is too short to
# be sure the field is on screen (see the scroll comment below). Maestro's text match is a full
# match, so this cannot hit the hint or notice sentences that merely mention "Other bank".
- scrollUntilVisible:
    element:
      text: "Other bank"
    direction: DOWN
    centerElement: true
- tapOn: "Other bank"
# Same reason as dashboard.yaml's scrollUntilVisible: the button is ImportScreen.tsx's
# ListFooterComponent, past the transaction rows above it, and this emulator's 320x640 screen is
# too short to reach it without scrolling -- confirmed via a real run's UI-hierarchy dump, which
# had no "Import N transactions" text mounted at all at the pre-scroll position.
#
# centerElement: scrollUntilVisible stops the moment the button's bounds are on screen, which can
# still be underneath the tab bar -- the tab bar overlays the list (ImportScreen pads its lists
# for it), and its centre is the "+" button. On 2026-10-25 the nightly's tap on this button, on
# both attempts, ended on the "+" quick-add sheet ("Import Statement", "Add Transaction", "Add
# Goal"), per the saved UI hierarchy, and the backend never received a confirm. Centring the
# button first puts it well clear of the bar.
- scrollUntilVisible:
    element:
      text: "Import [1-9]\\d* transactions?"
    direction: DOWN
    centerElement: true
- assertVisible:
    text: "Import [1-9]\\d* transactions?"
- tapOn:
    text: "Import [1-9]\\d* transactions?"

# The summary step's headline is "Imported N transaction(s)" (ImportScreen.tsx, the `header` Text for
# step === 'summary'), not a fixed "Import complete" -- the Import redesign replaced that headline.
# On 2026-11-09 the nightly's import flow failed here on both attempts although the backend had
# accepted the confirm and the saved view hierarchy showed "Imported 3 transactions" (the failure
# screenshots were solid black, a capture artifact, not the app).
- assertVisible:
    text: "Imported [1-9]\\d* transactions?"
- assertVisible: "Import another"
