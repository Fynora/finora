# Signs in as the account .maestro/seed-test-user.sh creates, then confirms the app landed in the
# signed-in shell rather than staying on Login or bouncing to phone verification (see that script's
# own comment for why phone_verified is seeded directly rather than through the product -- the
# same reason e2e/fixtures/accounts.ts does it for the Playwright suite).
#
# A fresh install lands on AuthEntryScreen (mobile/src/screens/AuthEntryScreen.tsx), not Login
# directly -- RootNavigator only picks Login as the initial route after a sign-out. This flow goes
# through AuthEntry, matching what `clearState: true` below actually produces.
appId: com.fynora.android
env:
  TEST_EMAIL: maestro-test@finora.test
  TEST_PASSWORD: MaestroSeedPass2026
---
- launchApp:
    clearState: true

- assertVisible: "Sign in or create an account"
- tapOn: "Email or mobile number"
- inputText: ${TEST_EMAIL}
# The keyboard covers "Continue" the same way it covers the submit button below (see the
# hideKeyboard comment further down) -- without this, the tap can land on the Gboard toolbar
# instead of the app, which visibly launched Gboard's own theme picker in a real CI run rather than
# tapping Continue at all.
- hideKeyboard
- tapOn: "Continue"

# AuthEntryScreen navigates to Login with the identifier prefilled once POST /auth/identify
# resolves it to an existing account -- see that screen's own doc comment. AuthScreenLayout's own
# title is ALSO the literal text "Sign in" -- a plain `tapOn: "Sign in"` matches that heading
# first (non-interactive) rather than the submit button below it, so the button carries its own
# testID (Button.tsx / LoginScreen.tsx) precisely so this selector isn't ambiguous.
- assertVisible: "Sign in"
- tapOn: "Password"
- inputText: ${TEST_PASSWORD}
# The on-screen keyboard covers the submit button entirely (it sits just below the password
# field) until dismissed -- verified against a real emulator run, not assumed.
- hideKeyboard
- tapOn:
    id: "login-submit"

# RootNavigator swaps the whole Auth stack out once AuthContext holds a token and the account is
# phone-verified (see LoginScreen.tsx's own comment: "No navigation on success"). Home is the
# first bottom tab -- see AppTabs.tsx -- and renders DashboardScreen. But onboardingCompleted is
# server-persisted (AuthContext.tsx) and false for every never-logged-in-before account, and this
# job's Postgres is a fresh services: container per run (see ci.yml's own comment on that) -- so
# seed-test-user.sh's account is, in effect, always brand new here, and RootNavigator routes it
# to OnboardingNavigator's WelcomeScreen instead of straight to AppTabs (see that file's own
# isAppTabsActive condition: onboardingCompleted || onboardingStep === 'tour').
#
# Going through the real "Skip for Now" button here, not seeding onboarding_completed=true in SQL
# alongside phone_verified: unlike phone verification, nothing about completing onboarding is
# genuinely impossible in CI (see seed-test-user.sh's own comment on that distinction) -- skipping
# it in SQL would mean this suite never once exercises OnboardingNavigator's real skip path.
# dashboard.yaml/import.yaml need no equivalent step: onboardingCompleted is persisted against this
# same account server-side, so their own logins (after this flow's skip has run) land on Home
# directly, same as any returning user.
- assertVisible: "Welcome to Fynora 👋"
- tapOn: "Skip for Now"

- assertVisible: "Home"
