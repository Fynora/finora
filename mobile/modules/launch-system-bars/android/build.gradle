plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.fynora.launchsystembars'
version = '1.0.0'

android {
  namespace "expo.modules.launchsystembars"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // The version five other modules in this app already resolve.
  implementation 'androidx.core:core-ktx:1.17.0'
}
