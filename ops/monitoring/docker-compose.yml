# Local observability stack: Prometheus, Grafana and Alertmanager against a locally running backend.
#
# WHY THIS EXISTS
# ---------------
# Dashboards and alert rules are code, and code that has never run is a guess. This stack is how a
# dashboard panel or an alert expression gets validated against real worker activity before anyone
# relies on it in production -- the difference between "the query is plausible" and "the query
# returns a series".
#
# It is NOT a production deployment. Production Prometheus/Grafana are infrastructure decisions
# (private network, retention, HA, auth) and belong outside this repository.
#
# USAGE
#   1. Run the backend locally (mvn spring-boot:run, or docker-compose up from the repo root).
#      It serves the scrape on port 9091 (management.server.port), not 8080. No token needed --
#      see prometheus.yml's header for why that is safe.
#   2. docker compose -f ops/monitoring/docker-compose.yml up
#   3. Prometheus http://localhost:9090  ·  Grafana http://localhost:3001 (admin/admin)
#      Alertmanager http://localhost:9093  ·  delivered alerts: docker compose logs webhook-sink
#   4. Generate worker activity: confirm a merchant category in the app, or POST to the learning
#      queue endpoints, then watch the worker panels on the dashboard move.
#
# The dashboards and datasource are provisioned from files, so what you validate here is byte-for-
# byte what a production Grafana would import.

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: finora-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Short retention: this is a validation stack, not a system of record.
      - --storage.tsdb.retention.time=24h
      - --web.enable-lifecycle
    extra_hosts:
      # Lets the container reach a backend running on the host. Native on Docker Desktop; declared
      # explicitly so it also works on Linux.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: finora-grafana
    # 3001 because 3000 is commonly taken by a dev server, and a port clash here reads as a broken
    # stack rather than as a port clash.
    ports:
      - "3001:3000"
    environment:
      # Local validation only. This stack is not reachable from anywhere else and holds no data
      # worth protecting -- production Grafana auth is an infrastructure decision.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Anonymous viewing keeps the loop tight when checking whether a panel renders.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # Built from the same Dockerfile Railway builds, so the routing validated here is the routing that
  # ships. Only the webhook URL differs: here it is the sink below; in production it is Better
  # Stack's Prometheus integration (see alertmanager/alertmanager.yml).
  alertmanager:
    build: ./alertmanager
    container_name: finora-alertmanager
    ports:
      - "9093:9093"
    environment:
      ALERT_WEBHOOK_URL: http://webhook-sink:8080/
    depends_on:
      - webhook-sink

  # Stands in for Better Stack: prints every notification Alertmanager delivers, so
  # `docker compose logs webhook-sink` shows exactly what production would have been sent. With no
  # backend running, BackendDown fires after its 5-minute `for:` and lands here. That is the quickest
  # end-to-end check that the chain delivers.
  webhook-sink:
    image: python:3.12-alpine
    container_name: finora-webhook-sink
    command:
      - python3
      - -u
      - -c
      - |
        import http.server, json
        class Sink(http.server.BaseHTTPRequestHandler):
            def do_POST(self):
                body = json.loads(self.rfile.read(int(self.headers["Content-Length"])))
                for a in body.get("alerts", []):
                    print(body["status"], a["labels"].get("alertname"), a["labels"].get("severity"),
                          a["annotations"].get("summary"), flush=True)
                self.send_response(200); self.end_headers()
            def log_message(self, *args): pass
        http.server.HTTPServer(("", 8080), Sink).serve_forever()
