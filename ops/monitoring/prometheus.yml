# Prometheus scrape configuration for Finora.
#
# THE PORT IS THE WHOLE POINT OF THIS FILE
# ----------------------------------------
# There is no credential here, and that is deliberate rather than an oversight. The scrape is
# reached by network position instead: /actuator lives on management.server.port (9091), which no
# public domain routes to, and nothing under /actuator is mapped on the application port at all.
# ManagementPortIsolationIT asserts both halves, and ManagementPortSeparationGuard refuses to boot
# if the separation is lost.
#
# This file used to carry a bearer token, back when the endpoint was authenticated on the public
# port. That was a sound posture with one fatal practical problem: the only credentials this system
# issues are user access tokens that expire in fifteen minutes, and there is no service principal to
# mint one for. The endpoint was secure and unscrapeable at once, which is why no production
# dashboard ever existed. Moving the port resolved that without publishing anything.
#
# IF YOU ARE TEMPTED TO ADD A TOKEN BACK, check first whether the scrape is failing because
# something re-exposed actuator on the application port. A credential would paper over exactly the
# regression the guard exists to catch.

global:
  # 15s matches the resolution the dashboards assume. Going finer costs storage without helping:
  # the worker poll interval is 30s by default, so a faster scrape samples the same value twice.
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    # Set per deployment so one Prometheus can hold more than one environment. Deliberately the
    # same value the backend stamps on every meter (management.metrics.tags.environment) and the
    # same one Sentry reports -- an alert and an error should agree about which deploy they mean.
    environment: local

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: finora-backend
    metrics_path: /actuator/prometheus
    scheme: http

    static_configs:
      # host.docker.internal reaches a backend running on the host from inside the compose network.
      # 9091 is management.server.port, NOT server.port -- port 8080 answers 404 here.
      #
      # On Railway this becomes the backend's private address, which is reachable only from inside
      # the project's own network:
      #   - targets: ['${RAILWAY_PRIVATE_DOMAIN}:9091']
      # See ops/monitoring/README.md, "Deploying this to production".
      - targets: ['host.docker.internal:9091']
        labels:
          service: backend
